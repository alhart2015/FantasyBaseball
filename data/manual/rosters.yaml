# Manual roster snapshot, 2026-09-22 -- DERIVED, not a fresh Roster-tab capture.
#
# HOW THIS ONE WAS BUILT. It is the 2026-09-14 file (the 2026-08-31 Roster-tab
# capture with three transaction replays on top) with a FOURTH replay of the
# Yahoo League Transactions feed, from user screenshots supplied 2026-09-24:
# 12 drops and 12 adds (one of them, Cal Quantrill, both added and dropped)
# across four teams between Sat Sep 12 09:23 PM, exclusive, and Mon Sep 22
# 06:16 AM, inclusive.
#
#   Sun Sep 14 09:06 AM  Hart of the Order     + Ian Seymour, - Yoendrys Gomez
#   Mon Sep 15 05:08 PM  Hart of the Order     - Byron Buxton (IL)
#   Mon Sep 15 05:09 PM  Hart of the Order     + Nathan Eovaldi
#   Fri Sep 19 07:32 AM  Springfield Isotopes  - Michael Soroka (IL)
#   Fri Sep 19 07:33 AM  Springfield Isotopes  + Isaac Paredes
#   Fri Sep 19 08:10 AM  Jon's Underdogs       - Edwin Diaz (IL), - Jacob Lopez
#   Fri Sep 19 08:11 AM  Jon's Underdogs       + Tyler Mahle
#   Fri Sep 19 08:41 AM  Hart of the Order     + Cal Quantrill (IL), - Logan Webb
#   Fri Sep 19 08:50 PM  Hello Peanuts!        + Carter Jensen, - Jeff McNeil
#   Fri Sep 19 08:52 PM  Hello Peanuts!        + Walbert Urena, - Chase Burns
#   Sun Sep 21 08:58 PM  Jon's Underdogs       + Nolan Arenado, - TJ Rumfield
#   Sun Sep 21 09:01 PM  Jon's Underdogs       - Kenley Jansen, + Garrett Crochet (IL)
#   Sun Sep 21 09:02 PM  Jon's Underdogs       + Andrew Alvarez
#   Mon Sep 22 06:16 AM  Hart of the Order     + Cristian Javier (IL), - Cal Quantrill
#
# The window is closed on both ends: the feed's second page still shows the
# Sep 12 Rumfield-for-House move the previous replay applied, and the first
# page's newest row is Sep 22 06:16 AM. Each same-minute swap was applied drop
# first, so an IL-badged add takes the IL slot its partner vacated. Every team
# ends inside the 23-active / 2-IL cap.
#
# THIS FILE IS NOW FOUR REPLAYS DEEP on a Roster-tab capture that is over three
# weeks old. A fresh Roster-tab transcription is the fix, not a fifth replay.
# Consequences, field by field:
#
#   name       TRUSTWORTHY. Every drop was matched against the canonical name
#              already on that exact roster, and an unmatched drop was a hard
#              error rather than a silent no-op; every add was resolved by
#              lookup against the ROS projection rows (name + team), never
#              typed from memory, and an add still rostered elsewhere in the
#              file was also a hard error. This feed printed full first names
#              rather than initials, so no ambiguity had to be settled.
#
#   slot       PLACEHOLDER for every player added by a replay: BN, or IL for an
#              add carrying the IL badge when an IL slot is free.
#              The feed says who joined a roster, never where the manager
#              slotted them. Boston Estrellas (BN=10) and Jon's Underdogs
#              (BN=7) are the worst of it and are nowhere near that bench-heavy
#              in reality. Re-transcribe from the Roster tab before trusting an
#              opponent's starter/bench split.
#
#   status     STALE for everyone carried over, BLANK for everyone added. An
#              injury since 2026-08-31 that involved no transaction is invisible
#              to the feed and therefore invisible here. status carries Yahoo's
#              red badge and is load-bearing: managers routinely park an IL'd
#              player in an ACTIVE or BN slot, which is detectable ONLY from
#              this field -- the slot alone says "active". Treat every badge
#              below as stale; an added player's badge is the feed's bare "IL".
#
# HART OF THE ORDER, 2026-09-22 replay: Seymour and Eovaldi land on BN as
# placeholders (Webb's P slot is left empty), and Javier takes the IL slot
# Quantrill held. Rafaela is still the other IL slot.
#
# HART OF THE ORDER, earlier. The user's own team was untouched in the replay before that;
# here it dropped Willy Adames off the IL (Sep 07 08:50 AM) and added Cole
# Carrigg (Sep 07 08:55 AM). That alone left the file at 24 active + 1 IL, one
# OVER the 23-active cap, because a Hart player had moved to the IL with no
# transaction for the feed to record. The user resolved it directly, from their
# own Roster tab: Ceddanne Rafaela and Byron Buxton hold the two IL slots, Juan
# Soto is active, and Adames is gone. Rafaela is therefore moved IF -> IL here,
# which is an OBSERVATION, not an inference; his `status` is left blank because
# the badge type (IL10 vs IL60) was not stated and is not worth inventing. That
# empties the IF slot, which is omitted rather than written as a placeholder.
# Every other Hart slot is still the 2026-08-31 capture.
#
# EMPTY starting slots are simply omitted rather than written as placeholders,
# so a team's slot counts can come up short of the configured lineup. The bench
# is overflow, not a fixed count -- the real constraint is total roster size.
#
# Player names are CANONICAL names resolved by lookup against the ROS projection
# rows (name + team + player_type), not typed from memory. Yahoo prints only a
# first initial on most surfaces, which is ambiguous. Re-derived from THIS file,
# the collisions are: Jhoan Duran (pitcher, Springfield Isotopes) vs Jarren
# Duran (hitter, Tortured Baseball Department), with Ezequiel Duran (Spacemen) a
# third Duran that the initial happens to separate; and William Contreras (C,
# Spacemen) vs Willson Contreras (Tortured Baseball Department). Shohei Ohtani
# appears TWICE across the league -- the batter on Work in Progress and the
# pitcher on Tortured Baseball Department -- and is stored under the same
# canonical name both times, because the loader keys on (name, player_type),
# never the bare name. Tortured Baseball Department also rosters Matt Chapman
# (3B) and Aroldis Chapman (P) on the same team, which the differing initials do
# separate. The Cade Smith / Cam Smith pair called out in the previous snapshot
# is gone: Boston Estrellas dropped Cam Smith on Sep 08.
