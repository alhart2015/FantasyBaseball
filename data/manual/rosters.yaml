# Manual roster transcription -- Yahoo web UI, Team > Roster tab, 2026-08-25.
#
# Player names are CANONICAL names resolved by lookup against the ROS projection
# rows (name + team + player_type), not typed from memory. Yahoo prints only a
# first initial, which is ambiguous: this league rosters both Cade Smith (CLE, P,
# SkeleThor) and Cam Smith (HOU, OF, Boston Estrellas), and both Mason Miller
# (SDP, Hart) and Bryce Miller (SEA). Shohei Ohtani appears TWICE across the
# league -- the batter on Work in Progress and the pitcher on Tortured Baseball
# Department -- and is stored under the same canonical name both times, because
# the loader keys on (name, player_type), never the bare name.
#
# slot / positions / status are copied verbatim from the Yahoo UI. status carries
# the red badge and is load-bearing: managers routinely park an IL'd player in an
# ACTIVE or BN slot, which is detectable ONLY from this field -- the slot alone
# says "active". No tally of which teams do it is kept here: it changes every
# refresh, nothing recomputes it, and a stale count reads as authoritative.
#
# EMPTY starting slots are simply omitted rather than written as placeholders,
# so a team's slot counts can come up short of the configured lineup. The bench
# is overflow, not a fixed count -- the real constraint is total roster size.

