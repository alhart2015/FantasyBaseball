# Manual roster snapshot, 2026-09-06 -- DERIVED, not a fresh Roster-tab capture.
#
# HOW THIS ONE WAS BUILT, and why that matters. The 2026-08-31 transcription was
# a real Yahoo Team > Roster capture. This file is that snapshot with the Yahoo
# League Transactions feed replayed onto it: 19 drops and 17 adds across four
# teams (Boston Estrellas, Jon's Underdogs, Hello Peanuts!, Springfield
# Isotopes) between Mon Aug 31 02:01 PM and Sat Sep 05 03:18 PM. The window is
# closed on both ends -- the feed reaches back past the 08-31 capture (the two
# Aug 29 moves in it are already reflected there), so no transaction fell
# between the snapshots. Consequences, field by field:
#
#   name       TRUSTWORTHY. Every drop was matched against the canonical name
#              already on that exact roster, and an unmatched drop was a hard
#              error rather than a silent no-op; every add was resolved by
#              lookup against the ROS projection rows, never typed from memory.
#              The two ambiguous initials were settled on projected volume:
#              J. Lopez is Jacob Lopez (ATH -- the only Lopez with real ROS
#              innings, 23 IP in all five systems; every other Lopez is a 1-IP
#              placeholder row) and B. Lee is Brooks Lee (MIN, 93 PA, and
#              2B/3B/SS matches the transaction) rather than the 1-PA
#              Bennett Lee.
#
#   slot       PLACEHOLDER for the 17 added players, which all sit on BN. That
#              is an artifact of the replay, not an observation -- the feed says
#              who joined a roster, never where the manager slotted them. In
#              reality those managers filled the starting slots their drops
#              emptied, so Boston Estrellas (BN=8) and Jon's Underdogs (BN=6)
#              read far more bench-heavy here than they are. No team is over the
#              23-active cap; nine sit exactly on it and Hello Peanuts! sits at
#              22, carrying one genuinely open spot from the bare Brandon Marsh
#              drop on Aug 31 10:28 PM that they never replaced. Re-transcribe
#              from the Roster tab before trusting an opponent's starter/bench
#              split.
#
#   status     STALE for everyone carried over, BLANK for everyone added. An
#              injury since 2026-08-31 that involved no transaction is invisible
#              to the feed and therefore invisible here. status carries Yahoo's
#              red badge and is load-bearing: managers routinely park an IL'd
#              player in an ACTIVE or BN slot, which is detectable ONLY from
#              this field -- the slot alone says "active". Treat every badge
#              below as at least six days old.
#
# Hart of the Order made no transactions in this window, so the user's own team
# is byte-identical to the 2026-08-31 capture -- slots and statuses included --
# and lineup work against it is unaffected by everything above.
#
# EMPTY starting slots are simply omitted rather than written as placeholders,
# so a team's slot counts can come up short of the configured lineup. The bench
# is overflow, not a fixed count -- the real constraint is total roster size.
#
# Player names are CANONICAL names resolved by lookup against the ROS projection
# rows (name + team + player_type), not typed from memory. Yahoo prints only a
# first initial, which is ambiguous. Re-derived from THIS file, the collisions
# are: Cade Smith (P, SkeleThor) vs Cam Smith (OF, Boston Estrellas); Jhoan
# Duran (pitcher, Springfield Isotopes) vs Jarren Duran (hitter, Tortured
# Baseball Department), with Ezequiel Duran (Spacemen) a third Duran that the
# initial happens to separate; and William Contreras (C, Spacemen) vs Willson
# Contreras (Tortured Baseball Department). Shohei Ohtani appears TWICE across
# the league -- the batter on Work in Progress and the pitcher on Tortured
# Baseball Department -- and is stored under the same canonical name both times,
# because the loader keys on (name, player_type), never the bare name. Tortured
# Baseball Department also rosters Matt Chapman (3B) and Aroldis Chapman (P) on
# the same team, which the differing initials do separate. The LAD Max Muncy is
# no longer in the league; only the Spacemen one remains, so that pair -- called
# out as a collision in earlier snapshots -- is not one here.

