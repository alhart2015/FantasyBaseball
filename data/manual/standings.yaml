# Manual standings transcription -- Yahoo web UI, ROTO > Stats + Points tabs.
#
# Source: user screenshot supplied 2026-09-08, showing both the Points and the
# Stats tab. The exact capture time was not recorded, so the cut-off is stated
# no more precisely than that: the totals are whatever Yahoo had posted when
# the screenshot was taken on 2026-09-08.
# League "Phantoms of the Outfield" (config/league.yaml id 5652).
#
# Yahoo's roto Stats tab exposes R HR RBI SB AVG IP W SV K ERA WHIP.
# It does NOT expose team AB or PA -- neither does the Yahoo API. Team AB is
# NOT left at zero, though: refresh_pipeline._build_standings (around line
# 1052) derives it from Team.ownership_periods intersected with the per-game
# hitter logs and injects it as extras[AB], which ytd_components then reads at
# AB sourcing tier 1. That derivation is MLB-sourced and runs unchanged in the
# manual pipeline, so no AB belongs in this file -- transcribing one here would
# be inventing a number that the pipeline already computes correctly.
#
# The Stats tab also shows GP; it is deliberately not transcribed, matching
# every earlier snapshot -- nothing downstream reads it.
#
# IP is recorded in Yahoo's innings.outs display format (1203.1 == 1203 IP + 1
# out, 1104.0 == 1104 IP + 0 outs), byte-identical to what the Yahoo API put in
# StandingsEntry.extras. Do not "fix" 1051.2 to 1051.667 -- that would diverge
# from the Yahoo path.

# Yahoo's authoritative roto points are recorded alongside the stats, per team.
#
# WHY THIS MATTERS: Yahoo DISPLAYS AVG/ERA/WHIP rounded (.252, 1.11) but RANKS
# on full precision. `category_points` carries Yahoo's real ordering so a
# display tie is still resolvable; `points_for` feeds
# StandingsEntry.yahoo_points_for, which the display layer already prefers over
# re-scored totals for exactly this reason.
#
# VALIDATED for this snapshot: the Points tab was transcribed independently of
# the Stats tab, then checked three ways -- every team's ten category points sum
# to its own Points column, every category sums to 55 across ten teams, and the
# league grand total is 550. All three pass exactly.
#
# Re-deriving points from the counting stats below with the repo's own
# `score_roto` reproduces Yahoo for 88 of the 100 cells. The twelve that differ
# are six DISPLAY ties in the rate categories, where average-rank scoring has
# to split evenly and Yahoo ranks the unrounded value:
#   AVG  .252  Jon's Underdogs / Spacemen                avg-rank 5.5/5.5, Yahoo 6/5
#   AVG  .246  Springfield Isotopes / Tortured Baseball  avg-rank 3.5/3.5, Yahoo 4/3
#   WHIP 1.11  Jon's Underdogs / Hart of the Order       avg-rank 9.5/9.5, Yahoo 10/9
#   WHIP 1.19  Hello Peanuts! / SkeleThor                avg-rank 6.5/6.5, Yahoo 7/6
#   WHIP 1.20  Boston Estrellas / Tortured Baseball      avg-rank 4.5/4.5, Yahoo 5/4
#   WHIP 1.30  Send in the Cavalli / Work in Progress    avg-rank 1.5/1.5, Yahoo 2/1
# THIS IS WHY THE POINTS TAB IS TRANSCRIBED RATHER THAN DERIVED. WHIP alone
# accounts for four of the six pairs this week -- eight teams sit on four
# displayed values, so a derived WHIP column would be wrong for all eight.
#
# The one remaining tie is a TRUE integer tie -- SB 115 (SkeleThor / Spacemen)
# -- and Yahoo scores it 3.5 / 3.5, exactly as average-rank does.
# See the checker in tests/test_manual/ -- it is a regression guard on future
# transcriptions.

