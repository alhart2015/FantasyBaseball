# Manual standings transcription -- Yahoo web UI, ROTO > Stats + Points tabs.
#
# Source: user screenshots, 2026-08-25. Stats are complete through the games of
# 2026-08-24 (the latest transaction visible in the same capture is Aug 24
# 10:22 pm).
# League "Phantoms of the Outfield" (config/league.yaml id 5652).
#
# Yahoo's roto Stats tab exposes R HR RBI SB AVG IP W SV K ERA WHIP.
# It does NOT expose team AB or PA -- neither does the Yahoo API. Team AB is
# NOT left at zero, though: refresh_pipeline._build_standings (around line
# 1052) derives it from Team.ownership_periods intersected with the per-game
# hitter logs and injects it as extras[AB], which ytd_components then reads at
# AB sourcing tier 1. That derivation is MLB-sourced and runs unchanged in the
# manual pipeline, so no AB belongs in this file -- transcribing one here would
# be inventing a number that the pipeline already computes correctly.
#
# IP is recorded in Yahoo's innings.outs display format (1079.1 == 1079 IP + 1
# out), byte-identical to what the Yahoo API put in StandingsEntry.extras.
# Do not "fix" it to 1079.333 -- that would diverge from the Yahoo path.

# Yahoo's authoritative roto points are recorded alongside the stats, per team.
#
# WHY THIS MATTERS: Yahoo DISPLAYS AVG/ERA/WHIP rounded (.250, 3.40, 1.12) but
# RANKS on full precision. `category_points` carries Yahoo's real ordering so a
# display tie is still resolvable; `points_for` feeds
# StandingsEntry.yahoo_points_for, which the display layer already prefers over
# re-scored totals for exactly this reason.
#
# VALIDATED for this snapshot: re-deriving points from the counting stats below
# reproduces Yahoo's category points EXACTLY for 98 of the 100 cells -- all of
# R HR RBI SB AVG W SV K ERA, and 8 of 10 in WHIP. The only disagreement is the
# WHIP 1.20 pair (SkeleThor / Tortured Baseball Department), which Yahoo itself
# renders as "1.20*" on both rows: average-rank scoring gives each 4.5, while
# Yahoo splits them 4 / 5 on the unrounded value. Both HR ties (254 Hart/Work in
# Progress, 195 SkeleThor/Spacemen) are TRUE integer ties and are correctly
# reproduced as 9.5 and 3.5. See the checker in tests/test_manual/ -- it is a
# regression guard on future transcriptions.

